<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="images.jpg" href="./favicon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-page">
        <div class="login-glow"></div>
        <div class="floating-shape shape-left"></div>
        <div class="floating-shape shape-ring"></div>

        <section class="login- container">

            <header class="brand">
                <div class="brand-logo">N</div>
                <div>
                    <p class="brand-name">teste</p>
                    <p class="brand-subtitle">ÁREA DO CLIENTE</p>
                </div>
            </header>
            <div class="login-card">
                <h1>
                    Entre no seu <span>espaço</span>
                </h1>
                <p class="login-description">
                    Informe seus dados para continuar.
                </p>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input 
                        type="text"
                        id="email"
                        name="email"
                        placeholder="voce@exemplo.com"
                        autocomplete="email"
                        required>
                    </div>
                    <div class="form-group">
                        <div class="password-header">
                            <label for="senha">Senha</label>
                            <a href="#">Esqueci minha senha</a>
                        </div>

                        <input 
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required>
                    </div>
                    <div class="form-group">
                    <div class="password-header">
                        <label for="senha">Senha</label>
                        <a href="#">Esqueci minha senha</a>
                    </div>
                     <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required>
              </div>
              <label class="remember">
                <input type="checkbox" name="lembrar">
                <span>Lembrar de mim</span>
              </label>
              <button class="primary-button" type="submit">
                Entrar
              </button>
            </form>
            
            <div class="divider">
                <span>ou</span>
            </div>

            <button class="secondary-button" type="button">
                Continuar com SSO
            </button>
            <p class="signup-text">
                Ainda não tem uma conta?
                <a href="#">Criar conta</a>
            </p>
        </div>
        <p class="security-text">
            Protegido com conexão segura
        </p>
        </section>
    </main>
</body>
</html>
